<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 VisualizerGrabber Web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0a0a0f; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #14141f; padding: 20px; border-radius: 12px; border: 1px solid #2a2a4a; margin-bottom: 20px; }
        h1 { color: #48dbfb; margin-bottom: 10px; }
        label { display: block; margin: 10px 0 5px; color: #aaa; }
        input { width: 100%; padding: 10px; background: #1e1e2f; border: 1px solid #3a3a5a; border-radius: 6px; color: #fff; }
        button { padding: 10px 20px; margin-top: 10px; background: #0a85d0; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #48dbfb; color: #000; }
        .log { background: #0a0a12; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; height: 200px; overflow-y: auto; margin-top: 10px; }
        .item { background: #1a1a2a; padding: 10px; margin-top: 5px; border-radius: 6px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎵 VisualizerGrabber Web</h1>
            
            <label>1. Настройка на Cloudflare Worker URL</label>
            <input type="url" id="workerUrl" placeholder="https://my-grabber.username.workers.dev">
            
            <label>2. URL на визуализатор</label>
            <input type="url" id="targetUrl" placeholder="https://example.com/vizy">
            
            <button onclick="startScrape()">🚀 Извлечи ресурси</button>
            <button onclick="startScreenRecord()" style="background:#ff6b6b;">⏺️ Запис на екран (Canvas)</button>
        </div>

        <div class="card">
            <h2>📦 Намерени ресурси</h2>
            <div id="results"></div>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }

        async function startScrape() {
            const worker = document.getElementById('workerUrl').value.trim();
            const target = document.getElementById('targetUrl').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!worker || !target) {
                alert('Попълни Worker URL и Target URL!');
                return;
            }

            log(`🚀 Заявка към Worker за: ${target}`);
            resultsDiv.innerHTML = 'Зареждане...';

            try {
                const res = await fetch(`${worker}?url=${encodeURIComponent(target)}`);
                const data = await res.json();

                if (data.error) throw new Error(data.error);

                log(`✅ Страница заглавие: ${data.title}`);
                log(`✅ Намерени източници: ${data.sources.length}`);

                resultsDiv.innerHTML = '';
                if (data.sources.length === 0) {
                    resultsDiv.innerHTML = '<div>Няма намерени директни медийни линкове. Използвай "Запис на екран".</div>';
                }

                data.sources.forEach(src => {
                    resultsDiv.innerHTML += `
                        <div class="item">
                            <div>${src}</div>
                            <a href="${src}" target="_blank" style="color:#48dbfb;">Свали / Отвори</a>
                        </div>
                    `;
                });
            } catch (err) {
                log(`❌ Грешка: ${err.message}`);
                resultsDiv.innerHTML = 'Грешка при извличането.';
            }
        }

        async function startScreenRecord() {
            try {
                log('⏺️ Изберете прозореца с визуализатора...');
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { displaySurface: "browser" },
                    audio: true
                });

                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `visualizer_${Date.now()}.webm`;
                    a.click();
                    log('✅ Записът е свален успешно!');
                };

                mediaRecorder.start();
                log('⏺️ Записването започна. Натиснете Stop Sharing в браузъра за край.');
            } catch (err) {
                log(`❌ Грешка при запис: ${err.message}`);
            }
        }
    </script>
</body>
</html>
