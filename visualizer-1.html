window.__cdbAnalyzeTempo = async function(file){
  try{
    const arrayBuffer = await file.arrayBuffer();
    const DecodeCtor = window.AudioContext || window.webkitAudioContext;
    const decodeCtx = new DecodeCtor();
    const audioBuffer = await decodeCtx.decodeAudioData(arrayBuffer.slice(0));
    decodeCtx.close();

    const sampleRate = audioBuffer.sampleRate;
    const OfflineCtor = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const offlineCtx = new OfflineCtor(1, audioBuffer.length, sampleRate);
    const src = offlineCtx.createBufferSource();
    src.buffer = audioBuffer;
    const filter = offlineCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 150;
    src.connect(filter); filter.connect(offlineCtx.destination);
    src.start(0);
    const rendered = await offlineCtx.startRendering();
    const data = rendered.getChannelData(0);

    const blockSize = 1024;
    const numBlocks = Math.floor(data.length / blockSize);
    const energies = new Float32Array(numBlocks);
    for (let i = 0; i < numBlocks; i++) {
      let sum = 0; const start = i * blockSize;
      for (let j = 0; j < blockSize; j++) { const v = data[start + j]; sum += v * v; }
      energies[i] = Math.sqrt(sum / blockSize);
    }
    const blockDur = blockSize / sampleRate;
    const avgWindow = Math.max(1, Math.round(1.0 / blockDur));
    const beatTimes = [];
    let lastBeatTime = -1;
    const minGap = 0.25;
    for (let i = 0; i < numBlocks; i++) {
      const wStart = Math.max(0, i - avgWindow);
      const wEnd = Math.min(numBlocks - 1, i + avgWindow);
      let sum = 0, count = 0;
      for (let k = wStart; k <= wEnd; k++) { sum += energies[k]; count++; }
      const localAvg = sum / count;
      if (energies[i] > localAvg * 1.3 && energies[i] > 0.015) {
        const prev = i > 0 ? energies[i - 1] : 0;
        const next = i < numBlocks - 1 ? energies[i + 1] : 0;
        if (energies[i] >= prev && energies[i] >= next) {
          const time = i * blockDur;
          if (time - lastBeatTime >= minGap) { beatTimes.push(time); lastBeatTime = time; }
        }
      }
    }
    let bpm = 120;
    if (beatTimes.length > 3) {
      const intervals = [];
      for (let i = 1; i < beatTimes.length; i++) intervals.push(beatTimes[i] - beatTimes[i - 1]);
      intervals.sort((a, b) => a - b);
      const median = intervals[Math.floor(intervals.length / 2)];
      if (median > 0) {
        bpm = 60 / median;
        while (bpm < 70 && bpm > 0) bpm *= 2;
        while (bpm > 180) bpm /= 2;
      }
    }

    // ---- DROP detection: най-голямият устойчив скок в енергията -------
    // (типично за EDM/trap/dance drop-ове: тих/build-up пасаж -> внезапно
    // силен, устойчив пасаж). Търсим само между 12% и 90% от песента, за
    // да не хванем самото начало/край.
    let dropTime = null;
    {
      const totalDur = numBlocks * blockDur;
      const beforeWin = Math.max(1, Math.round(2.0 / blockDur));
      const afterWin = Math.max(1, Math.round(3.0 / blockDur));
      const searchStart = Math.floor(numBlocks * 0.12);
      const searchEnd = Math.floor(numBlocks * 0.90);
      let maxEnergy = 0;
      for (let i = 0; i < numBlocks; i++) if (energies[i] > maxEnergy) maxEnergy = energies[i];
      let bestScore = -1, bestIdx = -1;
      for (let i = searchStart; i < searchEnd; i++) {
        const b0 = Math.max(0, i - beforeWin), b1 = i;
        const a0 = i, a1 = Math.min(numBlocks - 1, i + afterWin);
        let sumB = 0, cB = 0; for (let k = b0; k < b1; k++) { sumB += energies[k]; cB++; }
        if (!cB) continue;
        const avgB = sumB / cB;
        const afterSlice = Array.from(energies.slice(a0, a1 + 1)).sort((x, y) => x - y);
        if (!afterSlice.length) continue;

// визуализатора след като той е нарисувал всичко останало, затова ефектът
// влиза и в записаното видео (не е просто DOM overlay).
window.__cdbDrawDrop = function (ctx, canvas, currentTime) {

    if (!window.__cdbDropOn) return;
    const dropTime = window.__cdbDropTime;
    if (dropTime === null || dropTime === undefined) return;

    const t = dropTime - currentTime; // секунди до DROP-а (отрицателно = вече е минал)
    const w = canvas.width, h = canvas.height;

    if (t > 0 && t <= 3.05) {
      const num = Math.ceil(t);
      const frac = t - Math.floor(t); // 0..1, за пулсиращ мащаб
      const scale = 1 + (1 - frac) * 0.35;
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(scale, scale);
      ctx.font = 'bold ' + Math.round(h * 0.22) + 'px sans-serif';

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.lineWidth = Math.max(4, h * 0.01);
      ctx.strokeStyle = 'rgba(0,255,255,' + (0.8 * p) + ')';
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, (1 - p) * Math.max(w, h) * 0.55, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

  <script>
(function () {
  // ---- CD-B Records dashboard integration -------------------------------
  // Праща/приема съобщения с родителския прозорец (index.html), точно както
  // старият visualizer.html, за да работят непроменени:
  //   - Стъпка 2 (видим iframe): приема 'cdb-set-title'
  //   - "Бърз ъплоуд за стари песни" (скрит iframe): приема 'cdb-quick-audio',
  //     автоматично стартира запис щом аудиото е готово, и връща готовото
  //     видео през 'cdb-video-ready' / 'cdb-video-progress' / 'cdb-video-error'.
  let quickMode = false;
  let quickPending = false;
  let exportStarted = false;

  Object.defineProperty(window, '__cdbQuickMode', { get() { return quickMode; } });

  function hooksReady() {
    return !!(window.__cdbHooks && window.__cdbHooks.addFiles && window.__cdbHooks.startRec);
  }

  function waitForHooks(cb, triesLeft) {
    if (triesLeft === undefined) triesLeft = 100; // ~10s max
    if (hooksReady()) { cb(); return; }
    if (triesLeft <= 0) {
      if (quickMode) { try { parent.postMessage({ type: 'cdb-video-error', message: 'Визуализаторът не се зареди навреме.' }, '*'); } catch (e) {} }
      return;
    }
    setTimeout(() => waitForHooks(cb, triesLeft - 1), 100);
  }

  function watchForAudioReady() {
    let tries = 0;
    const iv = setInterval(() => {
      tries++;
      const el = window.__cdbHooks && window.__cdbHooks.audioRef && window.__cdbHooks.audioRef.current;
      if (el && el.duration && !isNaN(el.duration) && el.duration > 0 && quickPending && !exportStarted) {
        exportStarted = true;
        clearInterval(iv);
        setTimeout(() => startRecordingAndPlayback(el), 400);
      } else if (tries > 300) { // ~45s timeout waiting for audio to decode
        clearInterval(iv);
        if (quickPending && !exportStarted) {
          try { parent.postMessage({ type: 'cdb-video-error', message: 'Аудиото не се зареди навреме.' }, '*'); } catch (e) {}
        }
      }
    }, 150);
  }

  // MEGA V11's REC бутон записва, докато потребителят ръчно не натисне Стоп —
  // няма вградена логика да спре сам в края на песента (за разлика от стария
  // визуализатор). В автоматичния режим никой не натиска Стоп, затова следим
  // текущото време на аудиото тук и спираме записа сами, щом песента свърши.
  function startRecordingAndPlayback(audioEl) {
    try {
      window.__cdbHooks.startRec();
    } catch (err) {
      try { parent.postMessage({ type: 'cdb-video-error', message: String(err && err.message || err) }, '*'); } catch (e) {}
      return;
    }
    setTimeout(() => {
      try { window.__cdbHooks.play(); } catch (e) {}
      const dur = audioEl.duration;
      let stopped = false;
      const stopIt = () => {
        if (stopped) return;
        stopped = true;
        clearInterval(watchIv);
        setTimeout(() => { try { window.__cdbHooks.stopRec(); } catch (e) {} }, 250);
      };
      audioEl.addEventListener('ended', stopIt, { once: true });
      const watchIv = setInterval(() => {
        if (audioEl.currentTime >= dur - 0.15) stopIt();
      }, 200);
      // защитна горна граница — ако нещо не проработи, все пак спираме
      setTimeout(stopIt, (dur + 8) * 1000);
    }, 150);
  }

  window.addEventListener('message', (ev) => {
    if (!ev.data || typeof ev.data !== 'object') return;

    if (ev.data.type === 'cdb-set-title' && typeof ev.data.title === 'string' && ev.data.title.trim()) {
      waitForHooks(() => window.__cdbHooks.setTitle(ev.data.title));
    }

    if (ev.data.type === 'cdb-quick-audio' && ev.data.file) {
      quickMode = true;
      quickPending = true;
      waitForHooks(() => {
        if (typeof ev.data.title === 'string' && ev.data.title.trim()) {
          window.__cdbHooks.setTitle(ev.data.title);
        }
        window.__cdbHooks.addFiles([ev.data.file]);
        watchForAudioReady();
      });
    }
  });
})();
</script>
