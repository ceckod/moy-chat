<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat — Безплатен AI Клиент</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-primary: #020617;
      --bg-secondary: #0f172a;
      --bg-tertiary: #1e293b;
      --border: #1e293b;
      --border-light: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-bg: #111827;
      --user-border: #1f2937;
      --success: #10b981;
      --error: #ef4444;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-secondary);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #34d399, #3b82f6);
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }

    .sidebar-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .new-chat-btn, .file-btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .new-chat-btn:hover, .file-btn:hover {
      background: var(--border-light);
      border-color: #475569;
    }

    .sidebar-section {
      margin-top: 1.5rem;
    }

    .sidebar-label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .sidebar-select, .sidebar-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 0.5rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .sidebar-select:focus, .sidebar-input:focus {
      border-color: var(--accent);
    }

    .token-warning {
      font-size: 0.75rem;
      color: var(--success);
      margin-top: 0.5rem;
      line-height: 1.4;
    }

    .token-help {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      line-height: 1.5;
    }

    .token-help a {
      color: var(--accent);
    }

    .clear-btn {
      margin-top: 0.5rem;
      background: none;
      border: none;
      color: var(--error);
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .upload-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      line-height: 1.5;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.6);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      min-width: 0;
      min-height: 0;
    }

    .main-header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      font-size: 1.25rem;
    }

    .header-model {
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .chat-window {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1rem 1.5rem 0.5rem;
      scroll-behavior: smooth;
    }

    .messages-list {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .empty-state h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .message-row {
      display: flex;
      width: 100%;
      flex-direction: column;
    }

    .message-row.user {
      align-items: flex-end;
    }

    .message-row.assistant {
      align-items: flex-start;
    }

    .message-content {
      max-width: 90%;
      display: flex;
      gap: 0.75rem;
    }

    .message-row.user .message-content {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .message-row.assistant .message-avatar {
      background: var(--accent);
      color: #fff;
    }

    .message-row.user .message-avatar {
      background: var(--success);
      color: var(--bg-primary);
    }

    .message-bubble {
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      line-height: 1.65;
      word-wrap: break-word;
      overflow-x: auto;
      min-width: 0;
    }

    .message-row.user .message-bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--text-primary);
      border-bottom-right-radius: 0.25rem;
    }

    .message-row.assistant .message-bubble {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-bottom-left-radius: 0.25rem;
    }

    .inline-code {
      font-family: var(--font-mono);
      background: rgba(148, 163, 184, 0.15);
      padding: 0.1rem 0.35rem;
      border-radius: 0.3rem;
      font-size: 0.85em;
    }

    .code-block {
      margin: 0.6rem 0;
      border-radius: 0.6rem;
      overflow: hidden;
      border: 1px solid var(--border-light);
      background: #0a0f1a;
    }

    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.75rem;
      background: #111827;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      gap: 0.5rem;
    }

    .code-block-header span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.7rem;
      padding: 0.25rem 0.6rem;
      border-radius: 0.35rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: var(--border-light);
    }

    .code-block pre {
      margin: 0;
      padding: 0.85rem 1rem;
      overflow-x: auto;
    }

    .code-block code {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.55;
      white-space: pre;
      color: #d1fae5;
    }

    .download-zip-btn {
      margin-top: 0.6rem;
      margin-left: 40px;
      background: var(--success);
      border: none;
      color: #052e1c;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .download-zip-btn:hover {
      filter: brightness(1.08);
    }

    .typing-bubble {
      display: flex;
      align-items: center;
      padding: 1.25rem !important;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      display: inline-block;
      margin-right: 3px;
    }

    .input-area {
      padding: 0.75rem 1.25rem 1.5rem;
      background: transparent;
      flex-shrink: 0;
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 1.1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      padding: 0.3rem;
    }

    .chat-textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 0.85rem;
      color: var(--text-primary);
      padding: 0.7rem 3rem 0.7rem 0.85rem;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      line-height: 1.4;
      min-height: 40px;
      max-height: 160px;
      overflow-y: auto;
      display: block;
    }

    .send-btn {
      position: absolute;
      right: 0.45rem;
      top: 0.45rem;
      width: 32px;
      height: 32px;
      border-radius: 0.6rem;
      background: var(--accent);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .error-row .message-bubble {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
      .input-area {
        padding: 0.6rem 0.75rem 1.1rem;
        padding-bottom: calc(1.1rem + env(safe-area-inset-bottom));
      }
      .chat-window {
        padding: 0.85rem 0.75rem 0.5rem;
      }
      .message-content {
        max-width: 96%;
      }
      .download-zip-btn {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">G</div>
        <div class="sidebar-title">Gemini Chat</div>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        + Нов чат
      </button>

      <div class="sidebar-section">
        <label class="sidebar-label" for="modelSelect">Модел</label>
        <select class="sidebar-select" id="modelSelect">
          <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="tokenInput">Gemini API ключ</label>
        <input type="password" class="sidebar-input" id="tokenInput" placeholder="AIza...">
        <div class="token-warning" id="tokenStatus">Ключът се запазва локално.</div>
        <div class="token-help">Безплатен ключ: <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com/app/apikey</a></div>
        <button class="clear-btn" id="clearTokenBtn">Изтрий запазения ключ</button>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="zipInput">Сайт (ZIP)</label>
        <button class="file-btn" id="zipTriggerBtn" type="button">📦 Качи ZIP на сайта</button>
        <input type="file" id="zipInput" accept=".zip" style="display:none;">
        <div class="upload-status" id="uploadStatus">Няма качен файл.</div>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="main-header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" aria-label="Open sidebar">
            ☰
          </button>
          <div class="header-model">
            <span class="status-dot"></span>
            <span id="modelDisplay">Gemini 3.6 Flash</span>
          </div>
        </div>
      </header>

      <div class="chat-window" id="chatWindow">
        <div class="messages-list" id="messagesList">
          <div class="empty-state" id="emptyState">
            <h2>Започни разговор</h2>
            <p>Качи ZIP на сайта си или просто пиши. Кодът излиза в блокове с бутон "Копирай", а редактираните файлове можеш да свалиш обратно като ZIP.</p>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea class="chat-textarea" id="chatInput" placeholder="Напиши съобщение... (напр. 'смени цвета на бутоните в оранжево')" rows="1"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send">➔</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var SYSTEM_PROMPT = "You are a helpful coding assistant embedded in a website editor. The user may upload their website's files; when they do, each file is shown to you as a fenced code block whose first line inside the block is exactly 'FILE: relative/path/to/file'. When the user asks you to change, add, or fix something, respond with ONLY the files you changed or created, each as its own fenced code block formatted exactly like: three backticks, then the language, a newline, then a line that says 'FILE: relative/path/to/file', a newline, then the FULL new content of that file, then three backticks to close. Always output the complete content of each file you return, never a diff or partial snippet, never '...' placeholders. If no files were uploaded and the user asks you to build something from scratch, use the exact same FILE: format for every file so it can be packaged into a ZIP for download. Keep any explanation brief and outside the code blocks.";

      var TEXT_EXTS = ['html', 'htm', 'css', 'js', 'mjs', 'cjs', 'json', 'md', 'txt', 'xml', 'svg', 'yml', 'yaml', 'ts', 'jsx', 'tsx', 'csv'];
      var MAX_CONTEXT_CHARS = 250000;

      var messages = [];
      var isGenerating = false;

      var uploadedZip = null;      // JSZip instance of the originally uploaded archive (or null)
      var siteFiles = {};          // path -> current text content (authoritative, updated as edits arrive)
      var allFilePaths = [];       // every path in the uploaded archive (text + binary)

      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('overlay');
      var menuToggle = document.getElementById('menuToggle');
      var newChatBtn = document.getElementById('newChatBtn');
      var modelSelect = document.getElementById('modelSelect');
      var tokenInput = document.getElementById('tokenInput');
      var tokenStatus = document.getElementById('tokenStatus');
      var clearTokenBtn = document.getElementById('clearTokenBtn');
      var modelDisplay = document.getElementById('modelDisplay');
      var chatWindow = document.getElementById('chatWindow');
      var messagesList = document.getElementById('messagesList');
      var emptyState = document.getElementById('emptyState');
      var chatInput = document.getElementById('chatInput');
      var sendBtn = document.getElementById('sendBtn');
      var zipInput = document.getElementById('zipInput');
      var zipTriggerBtn = document.getElementById('zipTriggerBtn');
      var uploadStatus = document.getElementById('uploadStatus');

      // ---------- API key persistence ----------
      var savedToken = localStorage.getItem('gemini_api_key');
      if (savedToken) {
        tokenInput.value = savedToken;
        tokenStatus.textContent = "✓ Ключът е зареден.";
      }

      tokenInput.addEventListener('input', function () {
        var val = tokenInput.value.trim();
        if (val) {
          localStorage.setItem('gemini_api_key', val);
          tokenStatus.textContent = "✓ Ключът е запазен.";
        } else {
          localStorage.removeItem('gemini_api_key');
          tokenStatus.textContent = "Няма запазен ключ.";
        }
      });

      clearTokenBtn.addEventListener('click', function () {
        localStorage.removeItem('gemini_api_key');
        tokenInput.value = '';
        tokenStatus.textContent = "Ключът бе изтрит.";
      });

      function scrollToBottom() {
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      function getExt(path) {
        var m = path.match(/\.([a-zA-Z0-9]+)$/);
        return m ? m[1].toLowerCase() : '';
      }

      function isTextFile(path) {
        return TEXT_EXTS.indexOf(getExt(path)) !== -1;
      }

      // ---------- ZIP upload ----------
      zipTriggerBtn.addEventListener('click', function () { zipInput.click(); });

      zipInput.addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        if (typeof JSZip === 'undefined') {
          uploadStatus.textContent = 'JSZip не се зареди (провери мрежата) — опитай пак.';
          return;
        }
        uploadStatus.textContent = 'Разархивиране...';

        JSZip.loadAsync(file).then(function (zip) {
          uploadedZip = zip;
          siteFiles = {};
          allFilePaths = [];
          var textEntries = [];

          zip.forEach(function (relPath, entry) {
            if (entry.dir) return;
            allFilePaths.push(relPath);
            if (isTextFile(relPath)) textEntries.push({ path: relPath, entry: entry });
          });

          return Promise.all(textEntries.map(function (te) {
            return te.entry.async('string').then(function (content) {
              return { path: te.path, content: content };
            });
          })).then(function (results) { return { results: results, binaryCount: allFilePaths.length - textEntries.length }; });
        }).then(function (data) {
          var results = data.results;
          results.sort(function (a, b) { return a.content.length - b.content.length; });

          var used = 0;
          var included = [];
          var skipped = [];

          results.forEach(function (r) {
            if (used + r.content.length <= MAX_CONTEXT_CHARS) {
              siteFiles[r.path] = r.content;
              used += r.content.length;
              included.push(r.path);
            } else {
              skipped.push(r.path);
            }
          });

          var contextText = 'Ето файловете на качения сайт:\n\n' + included.map(function (p) {
            var ext = getExt(p) || 'text';
            return '```' + ext + '\nFILE: ' + p + '\n' + siteFiles[p] + '\n```';
          }).join('\n\n');

          if (skipped.length) {
            contextText += '\n\n(Пропуснати поради общ лимит на контекста, останаха непроменени: ' + skipped.join(', ') + ')';
          }
          if (data.binaryCount > 0) {
            contextText += '\n\n(' + data.binaryCount + ' двоични/media файла (снимки и др.) не са включени тук като текст, но ще бъдат запазени непроменени при сваляне на ZIP.)';
          }

          messages.push({ role: 'user', content: contextText, hidden: true });

          var summaryParts = [];
          summaryParts.push('📦 ' + included.length + ' текстови файла качени');
          if (skipped.length) summaryParts.push(skipped.length + ' пропуснати (голям общ размер)');
          if (data.binaryCount) summaryParts.push(data.binaryCount + ' media файла запазени');
          uploadStatus.textContent = summaryParts.join(', ') + '. Пиши какво да променя.';

          zipInput.value = '';
        }).catch(function (err) {
          uploadStatus.textContent = 'Грешка при четене на ZIP: ' + err.message;
        });
      });

      // ---------- Message rendering (code blocks, copy, file extraction) ----------

      // Parses assistant text for fenced blocks whose first content line is 'FILE: path'.
      // Returns { path: content, ... }
      function extractFilesFromText(text) {
        var files = {};
        var parts = String(text).split('```');
        for (var i = 1; i < parts.length; i += 2) {
          var part = parts[i];
          var firstNewline = part.indexOf('\n');
          var rest = part;
          if (firstNewline !== -1) {
            var maybeLang = part.slice(0, firstNewline).trim();
            if (maybeLang && maybeLang.length < 20 && !/\s/.test(maybeLang)) {
              rest = part.slice(firstNewline + 1);
            }
          }
          var restFirstNewline = rest.indexOf('\n');
          if (restFirstNewline !== -1) {
            var maybeFileLine = rest.slice(0, restFirstNewline).trim();
            var m = maybeFileLine.match(/^FILE:\s*(.+)$/i);
            if (m) {
              var path = m[1].trim().replace(/^\/+/, '');
              var content = rest.slice(restFirstNewline + 1).replace(/\n$/, '');
              files[path] = content;
            }
          }
        }
        return files;
      }

      function buildContentNode(text) {
        var container = document.createElement('div');
        var parts = String(text).split('```');

        parts.forEach(function (part, i) {
          if (i % 2 === 1) {
            var firstNewline = part.indexOf('\n');
            var lang = '';
            var code = part;
            if (firstNewline !== -1) {
              var maybeLang = part.slice(0, firstNewline).trim();
              if (maybeLang && maybeLang.length < 20 && !/\s/.test(maybeLang)) {
                lang = maybeLang;
                code = part.slice(firstNewline + 1);
              }
            }
            code = code.replace(/\n$/, '');

            var fileLabel = '';
            var codeFirstNewline = code.indexOf('\n');
            if (codeFirstNewline !== -1) {
              var maybeFileLine = code.slice(0, codeFirstNewline).trim();
              var fm = maybeFileLine.match(/^FILE:\s*(.+)$/i);
              if (fm) {
                fileLabel = fm[1].trim();
                code = code.slice(codeFirstNewline + 1);
              }
            }

            var block = document.createElement('div');
            block.className = 'code-block';

            var header = document.createElement('div');
            header.className = 'code-block-header';

            var langLabel = document.createElement('span');
            langLabel.textContent = fileLabel ? ('📄 ' + fileLabel) : (lang || 'code');

            var copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.type = 'button';
            copyBtn.textContent = 'Копирай';
            copyBtn.addEventListener('click', function () {
              var doCopy = function () {
                copyBtn.textContent = 'Копирано ✓';
                setTimeout(function () { copyBtn.textContent = 'Копирай'; }, 1500);
              };
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(doCopy).catch(doCopy);
              } else {
                doCopy();
              }
            });

            header.appendChild(langLabel);
            header.appendChild(copyBtn);

            var pre = document.createElement('pre');
            var codeEl = document.createElement('code');
            codeEl.textContent = code;
            pre.appendChild(codeEl);

            block.appendChild(header);
            block.appendChild(pre);
            container.appendChild(block);
          } else if (part) {
            var lines = part.split('\n');
            lines.forEach(function (line, idx) {
              var segs = line.split(/(`[^`]+`)/g);
              segs.forEach(function (seg) {
                if (seg.length > 1 && seg.charAt(0) === '`' && seg.charAt(seg.length - 1) === '`') {
                  var codeSpan = document.createElement('code');
                  codeSpan.className = 'inline-code';
                  codeSpan.textContent = seg.slice(1, -1);
                  container.appendChild(codeSpan);
                } else if (seg) {
                  container.appendChild(document.createTextNode(seg));
                }
              });
              if (idx < lines.length - 1) {
                container.appendChild(document.createElement('br'));
              }
            });
          }
        });

        return container;
      }

      function rebuildAndDownloadZip() {
        var newZip = new JSZip();
        var paths = uploadedZip ? allFilePaths.slice() : Object.keys(siteFiles);

        Object.keys(siteFiles).forEach(function (p) {
          if (paths.indexOf(p) === -1) paths.push(p);
        });

        var tasks = paths.map(function (p) {
          if (siteFiles.hasOwnProperty(p)) {
            newZip.file(p, siteFiles[p]);
            return Promise.resolve();
          } else if (uploadedZip && uploadedZip.file(p)) {
            return uploadedZip.file(p).async('uint8array').then(function (data) {
              newZip.file(p, data);
            });
          }
          return Promise.resolve();
        });

        return Promise.all(tasks).then(function () {
          return newZip.generateAsync({ type: 'blob' });
        }).then(function (blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'site-edited.zip';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
        });
      }

      function createMessageElement(role, text, isError) {
        var row = document.createElement('div');
        row.className = 'message-row ' + (isError ? 'error-row' : role);

        var contentWrap = document.createElement('div');
        contentWrap.className = 'message-content';

        var avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = role === 'user' ? 'Аз' : 'AI';

        var bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.appendChild(buildContentNode(text));

        contentWrap.appendChild(avatar);
        contentWrap.appendChild(bubble);
        row.appendChild(contentWrap);

        if (role === 'assistant' && !isError) {
          var files = extractFilesFromText(text);
          var fileCount = Object.keys(files).length;
          if (fileCount > 0) {
            var dlBtn = document.createElement('button');
            dlBtn.className = 'download-zip-btn';
            dlBtn.type = 'button';
            dlBtn.textContent = '⬇ Свали ZIP (' + fileCount + (fileCount === 1 ? ' файл' : ' файла') + ')';
            dlBtn.addEventListener('click', function () {
              Object.keys(files).forEach(function (p) {
                siteFiles[p] = files[p];
                if (allFilePaths.indexOf(p) === -1) allFilePaths.push(p);
              });
              dlBtn.textContent = 'Подготвям...';
              rebuildAndDownloadZip().then(function () {
                dlBtn.textContent = '⬇ Свали ZIP (' + fileCount + (fileCount === 1 ? ' файл' : ' файла') + ')';
              }).catch(function (err) {
                dlBtn.textContent = 'Грешка: ' + err.message;
              });
            });
            row.appendChild(dlBtn);
          }
        }

        return row;
      }

      function showTyping() {
        var row = document.createElement('div');
        row.className = 'message-row assistant typing-row';
        row.id = 'typingRow';

        var contentWrap = document.createElement('div');
        contentWrap.className = 'message-content';

        var avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = 'AI';

        var bubble = document.createElement('div');
        bubble.className = 'message-bubble typing-bubble';
        bubble.innerHTML = '<div class="typing-indicator"><span>.</span><span>.</span><span>.</span></div>';

        contentWrap.appendChild(avatar);
        contentWrap.appendChild(bubble);
        row.appendChild(contentWrap);
        messagesList.appendChild(row);
        scrollToBottom();
      }

      function removeTyping() {
        var row = document.getElementById('typingRow');
        if (row) row.remove();
      }

      function renderMessages() {
        messagesList.innerHTML = '';
        var visible = messages.filter(function (m) { return !m.hidden; });

        if (visible.length === 0) {
          messagesList.appendChild(emptyState);
          return;
        }

        visible.forEach(function (msg) {
          messagesList.appendChild(createMessageElement(msg.role, msg.content, false));
        });

        scrollToBottom();
      }

      function addErrorMessage(text) {
        removeTyping();
        var el = createMessageElement('assistant', text, true);
        messagesList.appendChild(el);
        scrollToBottom();
      }

      function buildGeminiContents() {
        return messages.map(function (m) {
          return {
            role: m.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: m.content }]
          };
        });
      }

      function sendMessage() {
        if (isGenerating) return;

        var text = chatInput.value.trim();
        if (!text) return;

        var apiKey = tokenInput.value.trim() || localStorage.getItem('gemini_api_key');

        if (!apiKey) {
          alert('Моля, въведи своя безплатен Gemini API ключ в страничното меню!');
          sidebar.classList.add('open');
          overlay.classList.add('active');
          return;
        }

        messages.push({ role: 'user', content: text });
        chatInput.value = '';
        chatInput.style.height = 'auto';
        isGenerating = true;

        renderMessages();
        showTyping();

        var model = modelSelect.value;
        var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(apiKey);

        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: buildGeminiContents(),
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            generationConfig: { maxOutputTokens: 16384 }
          })
        })
        .then(function (response) {
          removeTyping();
          if (!response.ok) {
            return response.json().then(function (errData) {
              var msg = 'Грешка ' + response.status;
              if (errData && errData.error && errData.error.message) {
                msg += ': ' + errData.error.message;
              } else {
                msg += ': ' + response.statusText;
              }
              if (response.status === 429) {
                msg += ' (стигнат е лимитът на безплатната квота — изчакай малко и опитай пак)';
              }
              addErrorMessage(msg);
              isGenerating = false;
            }).catch(function () {
              addErrorMessage('Грешка ' + response.status + ': ' + response.statusText);
              isGenerating = false;
            });
          }
          return response.json().then(function (data) {
            var generated = '';
            if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
              generated = data.candidates[0].content.parts.map(function (p) { return p.text || ''; }).join('');
            }
            if (!generated) {
              var reason = data.candidates && data.candidates[0] && data.candidates[0].finishReason;
              generated = reason ? '(Няма отговор — причина: ' + reason + ')' : '(Празен отговор от модела)';
            }
            messages.push({ role: 'assistant', content: generated });
            renderMessages();
            isGenerating = false;
          });
        })
        .catch(function (err) {
          removeTyping();
          addErrorMessage('Грешка: ' + err.message);
          isGenerating = false;
        });
      }

      sendBtn.addEventListener('click', sendMessage);

      chatInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      chatInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 160) + 'px';
      });

      newChatBtn.addEventListener('click', function () {
        messages = [];
        uploadedZip = null;
        siteFiles = {};
        allFilePaths = [];
        uploadStatus.textContent = 'Няма качен файл.';
        renderMessages();
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
        }
      });

      modelSelect.addEventListener('change', function () {
        modelDisplay.textContent = modelSelect.options[modelSelect.selectedIndex].text;
      });

      menuToggle.addEventListener('click', function () {
        sidebar.classList.add('open');
        overlay.classList.add('active');
      });

      overlay.addEventListener('click', function () {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      });

      renderMessages();
    });
  </script>
</body>
</html>
