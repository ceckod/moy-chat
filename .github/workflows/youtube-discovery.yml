name: YouTube Auto Playlist Discovery Engine

on:
  schedule:
    # 11:00 UTC всеки ден — след daily-stats.yml (09:00 UTC), за да ползва
    # най-пресния snapshot от data/stats-history.json (performance данни).
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (нищо не се пише в YouTube, само лог на плана)"
        type: boolean
        default: false
      reclassify_unknown:
        description: "Преизкласифицирай заседнали genre=unknown записи в каталога (вместо обичайния discovery run)"
        type: boolean
        default: false

permissions:
  contents: write  # нужно, за да може workflow-ът да прави commit обратно в repo-то

concurrency:
  # Истинската защита срещу два едновременни discovery job-а (виж докстринга
  # в youtube_discovery_engine.py — GH concurrency е атомарен, git-lock файл
  # не е). cancel-in-progress: false → втори тригер ИЗЧАКВА, не убива първия
  # наполовина (важно, за да не оставим playlist в несигурно състояние).
  group: youtube-discovery-engine
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Discovery Engine
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          # AI "арсенал" за класификация (жанр/поджанр/mood/BPM) — виж
          # call_ai_json() в scripts/_youtube_common.py. Всеки от тези е
          # ПО ИЗБОР поотделно — колкото повече добавиш, толкова по-рядко
          # engine-ът пада на грубия heuristic keyword fallback. Pollinations
          # не иска ключ изобщо, затова винаги има поне един работещ път.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.reclassify_unknown }}" = "true" ]; then
            python scripts/track_stats.py
            python scripts/catalog_bootstrap.py --reclassify-unknown
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/youtube_discovery_engine.py --dry-run
          else
            python scripts/youtube_discovery_engine.py
          fi

      - name: Stage only expected data files
        run: |
          git add -f \
            data/catalog.json data/playlists-state.json data/discovery-log.json \
            data/track-performance.json data/discovery-candidates-cache.json \
            data/discovery-dry-run-preview.json 2>/dev/null || true
          echo "── git status (трябва да съдържа само data/*.json) ──"
          git status --short
          echo "── staged diff stat ──"
          git diff --cached --stat

      - name: Assert only data/*.json staged (т.36 — никога изходен код/секрети)
        run: |
          UNEXPECTED=$(git diff --cached --name-only | grep -v '^data/.*\.json$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "🚫 Неочаквани staged файлове извън data/*.json — абортирам commit:"
            echo "$UNEXPECTED"
            exit 1
          fi

      - name: Secret scan (т.39 — никога API ключове/токени в commit)
        run: python scripts/_secret_scan.py

      - name: Commit updated discovery data
        run: |
          git config user.name "cdb-discovery-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet --cached; then
            echo "No changes — skip commit."
          else
            git commit -m "🎧 Discovery Engine run ($(date -u +%Y-%m-%d))"
            git push
          fi

          
