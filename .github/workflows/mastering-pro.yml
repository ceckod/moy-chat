name: Mastering Pro Engine

# ============================================================
# КАК СЕ ТРИГВА
# ------------------------------------------------------------
# workflow_dispatch, извикан от браузъра (js/mastering-pro.js →
# POST /repos/{owner}/{repo}/actions/workflows/mastering-pro.yml/dispatches
# с Keys.load().ghToken, същия pattern като js/metadata-optimizer.js).
#
# ВХОДНИТЕ файлове (target.wav + reference.wav) идват през GitHub
# RELEASES API, НЕ през Git Data API blobs както преди:
#   1) браузърът създава GitHub Release с таг "mastering-job-<job_id>"
#   2) upload-ва target.wav + reference.wav като release ASSETS (POST
#      към uploads.github.com/repos/.../releases/{id}/assets — приема
#      суров бинарен body, до 2GB на asset — виж подробния коментар
#      "ЗАЩО RELEASES API ЗА ВХОДА" в js/mastering-pro.js)
#   3) тригва СЕ workflow_dispatch с job_id (тагът се извежда тук долу
#      от job_id, не се предава отделно)
# Тук долу сваляме тези 2 asset-а с `gh release download` (нужен е само
# GH_TOKEN, работи "server-side" в Actions — няма browser CORS проблем).
#
# ИЗХОДНИЯТ файл (result.wav) + status.json продължават да минават през
# git commit (КАКТО ПРЕДИ), НЕ през Releases API — причината е чисто
# техническа: release asset-ите (release-assets.githubusercontent.com)
# НЕ връщат Access-Control-Allow-Origin хедър, т.е. браузърът НЕ може
# да ги свали през fetch() (CORS блокира дори публични repo-та — само
# обикновена <a href> навигация би минала, но тогава няма как да пуснем
# резултата в <audio> плейъра inline). raw.githubusercontent.com (пътят
# зад Contents API, използван от ghGetFileBinary в js/mastering-pro.js)
# е единственият CORS-friendly вариант за browser fetch, затова
# result.wav продължава да се commit-ва в git (лимит ~100MB на файл,
# виж бележката в js/mastering-pro.js) — практически достатъчно за
# нормален по дължина мастеринг мастъртрак (16-bit 44.1kHz стерео
# ~90MB ≈ ~8-9 минути).
#
# `run-name` по-долу вгражда job_id в името на run-а, за да може
# dashboard-ът да намери точно СВОЯ run (workflow_dispatch API-то не
# връща run_id директно при dispatch-ване).
# ============================================================

run-name: "Mastering Pro: ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID на job-а — генериран от браузъра; release тагът е mastering-job-<job_id>"
        required: true
      target_peak_db:
        description: "Целеви True Peak таван в dBTP (напр. -1.0)"
        required: false
        default: "-1.0"

permissions:
  contents: write

# Само ЕДИН run на конкретен job_id наведнъж (различни job_id-та вървят
# паралелно без проблем — виж repo конвенцията в auto-update.yml).
concurrency:
  group: mastering-pro-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  master:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: mastering-job-${{ inputs.job_id }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Свали target.wav + reference.wav от release asset-ите (Releases API, не Git Data API)
        id: findjob
        run: |
          JOB_DIR="mastering-jobs/${{ inputs.job_id }}"
          mkdir -p "$JOB_DIR"
          if ! gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --dir "$JOB_DIR" \
              --pattern "target.wav" --pattern "reference.wav" --clobber; then
            echo "::error::Не успях да сваля target.wav/reference.wav от release '$TAG' — браузърът трябва да ги upload-не ПРЕДИ да тригне този workflow."
            exit 1
          fi
          if [ ! -f "$JOB_DIR/target.wav" ] || [ ! -f "$JOB_DIR/reference.wav" ]; then
            echo "::error::Release '$TAG' не съдържа и двата очаквани asset-а (target.wav, reference.wav)."
            exit 1
          fi
          echo "job_dir=$JOB_DIR" >> "$GITHUB_OUTPUT"

      - name: Инсталирай Python зависимости (matchering, soundfile, numpy, scipy, soxr, pyloudnorm)
        run: pip install -r scripts/requirements-mastering.txt

      - name: Пусни master_engine.py
        id: engine
        run: |
          python scripts/master_engine.py \
            --job-dir "${{ steps.findjob.outputs.job_dir }}" \
            --target-peak-db "${{ inputs.target_peak_db }}"
        # НЕ спираме job-а тук при провал — искаме status.json (написан от
        # engine-а дори при exception, виж master_engine.py main()) да стигне
        # до repo-то, за да може dashboard-ът да покаже КАКВО се е счупило,
        # вместо да чака безкрайно на "processing".
        continue-on-error: true

      - name: Изтрий локалните входни WAV файлове (target/reference) — не ни трябват повече
        if: always() && steps.findjob.outputs.job_dir != ''
        run: |
          rm -f "${{ steps.findjob.outputs.job_dir }}/target.wav" "${{ steps.findjob.outputs.job_dir }}/reference.wav"

      - name: Изтрий входните asset-и от release-а (спестява storage — резултатите чакат в git до cleanup-а)
        if: always()
        run: |
          gh release delete-asset "$TAG" target.wav --repo "${{ github.repository }}" --yes || true
          gh release delete-asset "$TAG" reference.wav --repo "${{ github.repository }}" --yes || true

      - name: Stage само файловете на този job (result.wav + status.json, без входните WAV)
        if: always() && steps.findjob.outputs.job_dir != ''
        run: |
          git add -f "${{ steps.findjob.outputs.job_dir }}" 2>/dev/null || true
          echo "── staged diff stat ──"
          git diff --cached --stat

      - name: Assert — само файлове от този job_id са staged (защита срещу случайно commit-ване на нещо друго)
        if: always() && steps.findjob.outputs.job_dir != ''
        run: |
          UNEXPECTED=$(git diff --cached --name-only | grep -v "^${{ steps.findjob.outputs.job_dir }}/" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "🚫 Неочаквани staged файлове — абортирам commit:"
            echo "$UNEXPECTED"
            exit 1
          fi

      - name: Secret scan (никога API ключове/токени в commit)
        if: always() && steps.findjob.outputs.job_dir != ''
        run: python scripts/_secret_scan.py

      - name: Commit + push резултата
        if: always() && steps.findjob.outputs.job_dir != ''
        run: |
          git config user.name "cdb-mastering-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet --cached; then
            echo "Нищо за commit-ване."
          else
            git commit -m "🎚️ Mastering Pro: ${{ inputs.job_id }} (${{ steps.engine.outcome }})"
            git push
          fi

      - name: Job статус спрямо реалния изход на engine-а
        if: always()
        run: |
          if [ "${{ steps.engine.outcome }}" != "success" ]; then
            echo "::error::Mastering engine се провали — виж status.json в mastering-jobs/${{ inputs.job_id }}/ (commit-нат по-горе) за причината."
            exit 1
          fi
