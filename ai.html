<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HF Chat — Serverless AI Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    :root {
      --bg-primary: #020617;
      --bg-secondary: #0f172a;
      --bg-tertiary: #1e293b;
      --border: #1e293b;
      --border-light: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-bg: #111827;
      --user-border: #1f2937;
      --success: #10b981;
      --error: #ef4444;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'Fira Code', ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-secondary);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #34d399, #3b82f6);
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }

    .sidebar-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .new-chat-btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .new-chat-btn:hover {
      background: var(--border-light);
      border-color: #475569;
    }

    .sidebar-section {
      margin-top: 1.5rem;
    }

    .sidebar-label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .sidebar-select, .sidebar-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 0.5rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .sidebar-select:focus, .sidebar-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .token-warning {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.5rem;
      line-height: 1.4;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: #475569;
    }

    .sidebar-footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .sidebar-footer a:hover {
      color: var(--accent);
    }

    /* Overlay for mobile */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.6);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      min-width: 0;
    }

    .main-header {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
    }

    .header-model {
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 2px rgba(16, 185, 129, 0); }
    }

    /* Chat */
    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1.5rem;
      scroll-behavior: smooth;
    }

    .messages-list {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      background: var(--bg-secondary);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      color: var(--accent);
    }

    .empty-state h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      font-size: 0.875rem;
      max-width: 400px;
      line-height: 1.5;
    }

    /* Messages */
    .message-row {
      display: flex;
      width: 100%;
      animation: fadeIn 0.35s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 85%;
      display: flex;
      gap: 0.75rem;
    }

    .message-row.user .message-content {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 4px;
      user-select: none;
    }

    .message-row.assistant .message-avatar {
      background: var(--accent);
      color: #fff;
    }

    .message-row.user .message-avatar {
      background: var(--success);
      color: var(--bg-primary);
    }

    .message-bubble {
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      line-height: 1.65;
      word-wrap: break-word;
    }

    .message-row.user .message-bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--text-primary);
      border-bottom-right-radius: 0.25rem;
    }

    .message-row.assistant .message-bubble {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-bottom-left-radius: 0.25rem;
    }

    .message-bubble h1, .message-bubble h2, .message-bubble h3 {
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    .message-bubble h1 { font-size: 1.15rem; }
    .message-bubble h2 { font-size: 1.05rem; }
    .message-bubble h3 { font-size: 0.95rem; }

    .message-bubble p {
      margin-bottom: 0.75rem;
    }

    .message-bubble p:last-child {
      margin-bottom: 0;
    }

    .message-bubble ul, .message-bubble ol {
      margin-left: 1.25rem;
      margin-bottom: 0.75rem;
    }

    .message-bubble li {
      margin-bottom: 0.35rem;
    }

    .message-bubble code {
      background: #334155;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-family: var(--font-mono);
      font-size: 0.85em;
      color: #e2e8f0;
    }

    .code-block-wrapper {
      margin: 1rem 0;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0f172a;
    }

    .message-bubble pre {
      padding: 0.75rem 1rem;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      background: transparent;
    }

    .message-bubble pre code {
      background: transparent;
      padding: 0;
      font-size: inherit;
      border-radius: 0;
      color: inherit;
    }

    .message-bubble blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
      margin: 0.75rem 0;
    }

    .message-bubble a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .typing-bubble {
      display: flex;
      align-items: center;
      padding: 1.25rem !important;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    .input-area {
      border-top: 1px solid var(--border);
      padding: 1.25rem 1.5rem 1.5rem;
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
    }

    .chat-textarea {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      color: var(--text-primary);
      padding: 0.875rem 3rem 0.875rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 52px;
      max-height: 200px;
      overflow-y: auto;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .chat-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .send-btn {
      position: absolute;
      right: 0.6rem;
      bottom: 0.6rem;
      width: 32px;
      height: 32px;
      border-radius: 0.5rem;
      background: var(--accent);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn:disabled {
      background: var(--border-light);
      cursor: not-allowed;
    }

    .error-row .message-bubble {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border-bottom-left-radius: 0.25rem;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
      .message-content {
        max-width: 90%;
      }
      .chat-window {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">H</div>
        <div class="sidebar-title">HF Chat</div>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New Chat
      </button>

      <a href="index.html" class="new-chat-btn" style="text-decoration: none; margin-top: 0.5rem; background: #1e293b;">
        📱 Към Основния Чат
      </a>

      <div class="sidebar-section">
        <label class="sidebar-label" for="modelSelect">Model</label>
        <select class="sidebar-select" id="modelSelect">
          <option value="Qwen/Qwen2.5-72B-Instruct">Qwen 2.5 72B Instruct</option>
          <option value="deepseek-ai/DeepSeek-R1-Distill-Qwen-32B">DeepSeek R1 Distill Qwen 32B</option>
          <option value="meta-llama/Meta-Llama-3-8B-Instruct">Meta Llama 3 8B Instruct</option>
          <option value="mistralai/Mistral-7B-Instruct-v0.2">Mistral 7B Instruct v0.2</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="tokenInput">API Token</label>
        <input type="password" class="sidebar-input" id="tokenInput" placeholder="hf_...">
        <div class="token-warning">Your token is stored only in memory and is never persisted to storage.</div>
      </div>

      <div class="sidebar-footer">
        <p>Powered by <a href="https://huggingface.co/docs/api-inference" target="_blank">Hugging Face Router API</a>.</p>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="main-header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" aria-label="Open sidebar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="header-model">
            <span class="status-dot"></span>
            <span id="modelDisplay">Qwen 2.5 72B Instruct</span>
          </div>
        </div>
      </header>

      <div class="chat-window" id="chatWindow">
        <div class="messages-list" id="messagesList">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            </div>
            <h2>Start a conversation</h2>
            <p>Enter your Hugging Face API token in the sidebar, choose a model, and send a message to begin.</p>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea class="chat-textarea" id="chatInput" placeholder="Type a message..." rows="1"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

  <script>
    (function () {
      let messages = [
        { role: 'system', content: 'You are a helpful assistant.' }
      ];
      let isGenerating = false;

      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const menuToggle = document.getElementById('menuToggle');
      const newChatBtn = document.getElementById('newChatBtn');
      const modelSelect = document.getElementById('modelSelect');
      const tokenInput = document.getElementById('tokenInput');
      const modelDisplay = document.getElementById('modelDisplay');
      const chatWindow = document.getElementById('chatWindow');
      const messagesList = document.getElementById('messagesList');
      const emptyState = document.getElementById('emptyState');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function renderMarkdown(text) {
        const codeBlocks = [];
        text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
          const i = codeBlocks.length;
          const language = lang ? `language-${lang}` : 'language-plaintext';
          codeBlocks.push(
            `<div class="code-block-wrapper"><pre><code class="${language}">${escapeHtml(code.trimEnd())}</code></pre></div>`
          );
          return `\n\n__CODE_BLOCK_${i}__\n\n`;
        });

        text = escapeHtml(text);
        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
        text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
        text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
        text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        text = text.replace(/^# (.*$)/gim, '<h1>$1</h1>');

        const blocks = text.split(/\n\s*\n/);
        text = blocks
          .map((block) => {
            block = block.trim();
            i
