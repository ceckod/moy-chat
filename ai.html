<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Chat — Безплатен AI Клиент</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-primary: #020617;
      --bg-secondary: #0f172a;
      --bg-tertiary: #1e293b;
      --border: #1e293b;
      --border-light: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-bg: #111827;
      --user-border: #1f2937;
      --success: #10b981;
      --error: #ef4444;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-secondary);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
    }

    /* Sidebar */
    .sidebar {
      width: 300px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #34d399, #3b82f6);
      border-radius: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .sidebar-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .new-chat-btn, .file-btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.6rem;
      background: var(--accent);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
    }

    .new-chat-btn:hover {
      background: var(--accent-hover);
    }

    .file-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      font-weight: 500;
      box-shadow: none;
    }

    .file-btn:hover {
      background: var(--border-light);
    }

    .sidebar-section {
      margin-top: 1.25rem;
    }

    .sidebar-label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .sidebar-select, .sidebar-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 0.5rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .sidebar-select:focus, .sidebar-input:focus {
      border-color: var(--accent);
    }

    /* History List */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 0.4rem;
      padding-right: 2px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.75rem;
      border-radius: 0.5rem;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 0.825rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .history-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .history-item.active {
      background: var(--bg-tertiary);
      border-color: var(--accent);
      color: var(--text-primary);
      font-weight: 500;
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      padding-right: 0.5rem;
    }

    .history-del {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      opacity: 0.6;
    }

    .history-del:hover {
      color: var(--error);
      opacity: 1;
      background: rgba(239, 68, 68, 0.15);
    }

    .token-warning {
      font-size: 0.75rem;
      color: var(--success);
      margin-top: 0.4rem;
      line-height: 1.4;
    }

    .token-help {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
      line-height: 1.4;
    }

    .token-help a {
      color: var(--accent);
    }

    .clear-btn {
      margin-top: 0.4rem;
      background: none;
      border: none;
      color: var(--error);
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .upload-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
      line-height: 1.4;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.6);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      min-width: 0;
      min-height: 0;
    }

    .main-header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.4rem;
      font-size: 1.3rem;
      border-radius: 0.4rem;
    }

    .menu-toggle:hover {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }

    .header-model {
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .chat-window {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1rem 1.25rem 0.5rem;
      scroll-behavior: smooth;
    }

    .messages-list {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .empty-state h2 {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.6rem;
    }

    .empty-state p {
      max-width: 500px;
      line-height: 1.5;
      font-size: 0.925rem;
    }

    .message-row {
      display: flex;
      width: 100%;
      flex-direction: column;
    }

    .message-row.user {
      align-items: flex-end;
    }

    .message-row.assistant {
      align-items: flex-start;
    }

    .message-content {
      max-width: 90%;
      display: flex;
      gap: 0.75rem;
    }

    .message-row.user .message-content {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .message-row.assistant .message-avatar {
      background: var(--accent);
      color: #fff;
    }

    .message-row.user .message-avatar {
      background: var(--success);
      color: var(--bg-primary);
    }

    .message-bubble {
      padding: 0.9rem 1.15rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      line-height: 1.65;
      word-wrap: break-word;
      overflow-x: auto;
      min-width: 0;
    }

    .message-row.user .message-bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--text-primary);
      border-bottom-right-radius: 0.25rem;
    }

    .message-row.assistant .message-bubble {
      background: rgba(30, 41, 59, 0.45);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-bottom-left-radius: 0.25rem;
    }

    .attachment-preview-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .attachment-card {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-light);
      padding: 0.35rem 0.6rem;
      border-radius: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-primary);
    }

    .attachment-card img {
      max-width: 40px;
      max-height: 40px;
      border-radius: 0.25rem;
      object-fit: cover;
    }

    .inline-code {
      font-family: var(--font-mono);
      background: rgba(148, 163, 184, 0.15);
      padding: 0.1rem 0.35rem;
      border-radius: 0.3rem;
      font-size: 0.85em;
    }

    .code-block {
      margin: 0.6rem 0;
      border-radius: 0.6rem;
      overflow: hidden;
      border: 1px solid var(--border-light);
      background: #0a0f1a;
    }

    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.75rem;
      background: #111827;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      gap: 0.5rem;
    }

    .code-block-header span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.7rem;
      padding: 0.25rem 0.6rem;
      border-radius: 0.35rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: var(--border-light);
    }

    .code-block pre {
      margin: 0;
      padding: 0.85rem 1rem;
      overflow-x: auto;
    }

    .code-block code {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.55;
      white-space: pre;
      color: #d1fae5;
    }

    .download-zip-btn {
      margin-top: 0.6rem;
      margin-left: 38px;
      background: var(--success);
      border: none;
      color: #052e1c;
      font-family: inherit;
      font-size: 0.825rem;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
    }

    .download-zip-btn:hover {
      filter: brightness(1.08);
    }

    .typing-bubble {
      display: flex;
      align-items: center;
      padding: 1rem 1.25rem !important;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      display: inline-block;
      margin-right: 3px;
      animation: typing 1.4s infinite ease-in-out both;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Fixed & Lifted Input Area for Mobile Ergonomics */
    .input-area {
      padding: 0.75rem 1.25rem 2rem;
      background: var(--bg-primary);
      border-top: 1px solid rgba(30, 41, 59, 0.5);
      flex-shrink: 0;
      z-index: 20;
    }

    .input-wrapper {
      max-width: 820px;
      margin: 0 auto;
      position: relative;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 1.2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      padding: 0.4rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .attachments-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.2rem 0.4rem;
    }

    .attach-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      border-radius: 0.4rem;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      color: var(--text-primary);
    }

    .attach-chip-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      padding: 0 0.1rem;
    }

    .attach-chip-remove:hover {
      color: var(--error);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 0.4rem;
    }

    .attach-btn {
      width: 38px;
      height: 38px;
      border-radius: 0.75rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .attach-btn:hover {
      background: var(--border-light);
      color: var(--text-primary);
    }

    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      padding: 0.55rem 0.4rem;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      line-height: 1.45;
      min-height: 38px;
      max-height: 150px;
      overflow-y: auto;
      display: block;
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 0.75rem;
      background: var(--accent);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 1.1rem;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    .error-row .message-bubble {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
      /* Extra bottom padding to stay above touch/gesture navigation bars */
      .input-area {
        padding: 0.6rem 0.75rem calc(1.75rem + env(safe-area-inset-bottom, 0px));
      }
      .chat-window {
        padding: 0.75rem 0.75rem 0.5rem;
      }
      .message-content {
        max-width: 96%;
      }
      .download-zip-btn {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">G</div>
        <div class="sidebar-title">Gemini AI Studio</div>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        + Нов разговор
      </button>

      <div class="sidebar-section">
        <label class="sidebar-label">Запазени разговори</label>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="modelSelect">Модел</label>
        <select class="sidebar-select" id="modelSelect">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (Бърз & Мултимодален)</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro (Сложни задачи)</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="tokenInput">Gemini API ключ</label>
        <input type="password" class="sidebar-input" id="tokenInput" placeholder="AIza...">
        <div class="token-warning" id="tokenStatus">Ключът се запазва локално.</div>
        <div class="token-help">Безплатен ключ: <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com/app/apikey</a></div>
        <button class="clear-btn" id="clearTokenBtn">Изтрий запазения ключ</button>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="zipInput">Контекст на сайт (ZIP)</label>
        <button class="file-btn" id="zipTriggerBtn" type="button">📦 Качи ZIP проект</button>
        <input type="file" id="zipInput" accept=".zip" style="display:none;">
        <div class="upload-status" id="uploadStatus">Няма качен ZIP проект.</div>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="main-header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" aria-label="Open sidebar">
            ☰
          </button>
          <div class="header-model">
            <span class="status-dot"></span>
            <span id="modelDisplay">Gemini 2.5 Flash</span>
          </div>
        </div>
      </header>

      <div class="chat-window" id="chatWindow">
        <div class="messages-list" id="messagesList">
          <div class="empty-state" id="emptyState">
            <h2>Започни нов разговор</h2>
            <p>Прикачвай снимки, MP3 аудио, документи или ZIP проекти. Пиши инструкции за генериране или редактиране на код с моментален свали-бутон!</p>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <div class="attachments-bar" id="attachmentsBar" style="display: none;"></div>
          <div class="input-row">
            <button class="attach-btn" id="attachBtn" type="button" title="Прикачи файл (Снимка, MP3, PDF, Код)">📎</button>
            <input type="file" id="fileAttachInput" multiple style="display:none;">
            <textarea class="chat-textarea" id="chatInput" placeholder="Напиши съобщение или прикачи файл..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" aria-label="Send">➔</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var SYSTEM_PROMPT = "You are a helpful coding and multimodal assistant embedded in an AI editor. The user may upload their website files or send files (images, audio, PDF, code). When asked to modify or build website code, respond with ONLY the files changed or created, each as a fenced code block with 'FILE: path/to/file' as the first line inside the code block. Always output FULL file contents, never partial diffs or shortcuts. Keep brief explanations outside code blocks.";

      var TEXT_EXTS = ['html', 'htm', 'css', 'js', 'mjs', 'cjs', 'json', 'md', 'txt', 'xml', 'svg', 'yml', 'yaml', 'ts', 'jsx', 'tsx', 'csv'];
      var MAX_CONTEXT_CHARS = 250000;

      // Session State
      var sessions = [];
      var activeSessionId = null;
      var pendingAttachments = []; // Files attached to the prompt before sending
      var isGenerating = false;

      // Active Chat Context
      var currentMessages = [];
      var currentSiteFiles = {};
      var currentAllFilePaths = [];
      var currentUploadedZip = null;

      // UI Elements
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('overlay');
      var menuToggle = document.getElementById('menuToggle');
      var newChatBtn = document.getElementById('newChatBtn');
      var historyList = document.getElementById('historyList');
      var modelSelect = document.getElementById('modelSelect');
      var tokenInput = document.getElementById('tokenInput');
      var tokenStatus = document.getElementById('tokenStatus');
      var clearTokenBtn = document.getElementById('clearTokenBtn');
      var modelDisplay = document.getElementById('modelDisplay');
      var chatWindow = document.getElementById('chatWindow');
      var messagesList = document.getElementById('messagesList');
      var emptyState = document.getElementById('emptyState');
      var chatInput = document.getElementById('chatInput');
      var sendBtn = document.getElementById('sendBtn');
      var attachBtn = document.getElementById('attachBtn');
      var fileAttachInput = document.getElementById('fileAttachInput');
      var attachmentsBar = document.getElementById('attachmentsBar');
      var zipInput = document.getElementById('zipInput');
      var zipTriggerBtn = document.getElementById('zipTriggerBtn');
      var uploadStatus = document.getElementById('uploadStatus');

      // Persistence - Key
      var savedToken = localStorage.getItem('gemini_api_key');
      if (savedToken) {
        tokenInput.value = savedToken;
        tokenStatus.textContent = "✓ Ключът е зареден.";
      }

      tokenInput.addEventListener('input', function () {
        var val = tokenInput.value.trim();
        if (val) {
          localStorage.setItem('gemini_api_key', val);
          tokenStatus.textContent = "✓ Ключът е запазен.";
        } else {
          localStorage.removeItem('gemini_api_key');
          tokenStatus.textContent = "Няма запазен ключ.";
        }
      });

      clearTokenBtn.addEventListener('click', function () {
        localStorage.removeItem('gemini_api_key');
        tokenInput.value = '';
        tokenStatus.textContent = "Ключът бе изтрит.";
      });

      // Session Storage Management
      function loadSessionsFromStorage() {
        try {
          var stored = localStorage.getItem('gemini_chat_sessions');
          if (stored) {
            sessions = JSON.parse(stored);
          }
        } catch (e) {
          sessions = [];
        }
        if (!Array.isArray(sessions) || sessions.length === 0) {
          createNewSession();
        } else {
          activeSessionId = sessions[0].id;
          loadActiveSession();
        }
        renderHistoryList();
      }

      function saveSessionsToStorage() {
        try {
          // Sync current context into active session
          var idx = sessions.findIndex(function (s) { return s.id === activeSessionId; });
          if (idx !== -1) {
            sessions[idx].messages = currentMessages;
            sessions[idx].siteFiles = currentSiteFiles;
            sessions[idx].allFilePaths = currentAllFilePaths;
            sessions[idx].updatedAt = Date.now();
          }
          localStorage.setItem('gemini_chat_sessions', JSON.stringify(sessions));
        } catch (e) {
          console.warn("Storage warning:", e);
        }
      }

      function createNewSession() {
        var newId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        var newSession = {
          id: newId,
          title: 'Нов разговор',
          updatedAt: Date.now(),
          messages: [],
          siteFiles: {},
          allFilePaths: []
        };
        sessions.unshift(newSession);
        activeSessionId = newId;
        loadActiveSession();
        saveSessionsToStorage();
        renderHistoryList();
      }

      function loadActiveSession() {
        var s = sessions.find(function (item) { return item.id === activeSessionId; });
        if (!s) return;
        currentMessages = s.messages || [];
        currentSiteFiles = s.siteFiles || {};
        currentAllFilePaths = s.allFilePaths || [];
        currentUploadedZip = null;

        var fileCount = Object.keys(currentSiteFiles).length;
        if (fileCount > 0) {
          uploadStatus.textContent = 'Зареден проект (' + fileCount + ' файла)';
        } else {
          uploadStatus.textContent = 'Няма качен ZIP проект.';
        }

        renderMessages();
      }

      function deleteSession(id, e) {
        if (e) e.stopPropagation();
        sessions = sessions.filter(function (s) { return s.id !== id; });
        if (sessions.length === 0) {
          createNewSession();
        } else {
          if (activeSessionId === id) {
            activeSessionId = sessions[0].id;
          }
          loadActiveSession();
          saveSessionsToStorage();
          renderHistoryList();
        }
      }

      function renderHistoryList() {
        historyList.innerHTML = '';
        sessions.forEach(function (s) {
          var item = document.createElement('div');
          item.className = 'history-item' + (s.id === activeSessionId ? ' active' : '');

          var titleSpan = document.createElement('span');
          titleSpan.className = 'history-title';
          titleSpan.textContent = s.title || 'Разговор';

          var delBtn = document.createElement('button');
          delBtn.className = 'history-del';
          delBtn.innerHTML = '✕';
          delBtn.title = 'Изтрий';
          delBtn.addEventListener('click', function (e) { deleteSession(s.id, e); });

          item.appendChild(titleSpan);
          item.appendChild(delBtn);

          item.addEventListener('click', function () {
            if (activeSessionId !== s.id) {
              activeSessionId = s.id;
              loadActiveSession();
              renderHistoryList();
              if (window.innerWidth <= 768) {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
              }
            }
          });

          historyList.appendChild(item);
        });
      }

      function scrollToBottom() {
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      function getExt(path) {
        var m = path.match(/\.([a-zA-Z0-9]+)$/);
        return m ? m[1].toLowerCase() : '';
      }

      function isTextFile(path) {
        return TEXT_EXTS.indexOf(getExt(path)) !== -1;
      }

      // Attachments Handling (Images, Audio, PDF, Text)
      attachBtn.addEventListener('click', function () { fileAttachInput.click(); });

      fileAttachInput.addEventListener('change', function (e) {
        var files = Array.from(e.target.files);
        if (!files.length) return;

        files.forEach(function (file) {
          var reader = new FileReader();
          if (file.type.startsWith('image/') || file.type.startsWith('audio/') || file.type === 'application/pdf') {
            reader.readAsDataURL(file);
            reader.onload = function () {
              var base64 = reader.result.split(',')[1];
              pendingAttachments.push({
                name: file.name,
                type: file.type,
                mimeType: file.type,
                base64: base64,
                isInline: true
              });
              renderAttachmentsBar();
            };
          } else {
            reader.readAsText(file);
            reader.onload = function () {
              pendingAttachments.push({
                name: file.name,
                type: 'text',
                content: reader.result,
                isInline: false
              });
              renderAttachmentsBar();
            };
          }
        });

        fileAttachInput.value = '';
      });

      function renderAttachmentsBar() {
        if (pendingAttachments.length === 0) {
          attachmentsBar.style.display = 'none';
          attachmentsBar.innerHTML = '';
          return;
        }
        attachmentsBar.style.display = 'flex';
        attachmentsBar.innerHTML = '';

        pendingAttachments.forEach(function (att, idx) {
          var chip = document.createElement('div');
          chip.className = 'attach-chip';

          var icon = '📄';
          if (att.mimeType && att.mimeType.startsWith('image/')) icon = '🖼️';
          else if (att.mimeType && att.mimeType.startsWith('audio/')) icon = '🎵';
          else if (att.mimeType === 'application/pdf') icon = '📕';

          chip.textContent = icon + ' ' + att.name;

          var remBtn = document.createElement('button');
          remBtn.className = 'attach-chip-remove';
          remBtn.innerHTML = '✕';
          remBtn.addEventListener('click', function () {
            pendingAttachments.splice(idx, 1);
            renderAttachmentsBar();
          });

          chip.appendChild(remBtn);
          attachmentsBar.appendChild(chip);
        });
      }

      // ZIP Context Handler
      zipTriggerBtn.addEventListener('click', function () { zipInput.click(); });

      zipInput.addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        if (typeof JSZip === 'undefined') {
          uploadStatus.textContent = 'JSZip грешка — провери връзката.';
          return;
        }
        uploadStatus.textContent = 'Разархивиране...';

        JSZip.loadAsync(file).then(function (zip) {
          currentUploadedZip = zip;
          currentSiteFiles = {};
          currentAllFilePaths = [];
          var textEntries = [];

          zip.forEach(function (relPath, entry) {
            if (entry.dir) return;
            currentAllFilePaths.push(relPath);
            if (isTextFile(relPath)) textEntries.push({ path: relPath, entry: entry });
          });

          return Promise.all(textEntries.map(function (te) {
            return te.entry.async('string').then(function (content) {
              return { path: te.path, content: content };
            });
          })).then(function (results) { return { results: results, binaryCount: currentAllFilePaths.length - textEntries.length }; });
        }).then(function (data) {
          var results = data.results;
          results.sort(function (a, b) { return a.content.length - b.content.length; });

          var used = 0;
          var included = [];

          results.forEach(function (r) {
            if (used + r.content.length <= MAX_CONTEXT_CHARS) {
              currentSiteFiles[r.path] = r.content;
              used += r.content.length;
              included.push(r.path);
            }
          });

          uploadStatus.textContent = 'Заредени ' + included.length + ' файла.';
          saveSessionsToStorage();
          zipInput.value = '';
        }).catch(function (err) {
          uploadStatus.textContent = 'Грешка ZIP: ' + err.message;
        });
      });

      // Code Extractor
      function extractFilesFromText(text) {
        var files = {};
        var parts = String(text).split('
