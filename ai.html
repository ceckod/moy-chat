<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HF Chat — Serverless AI Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #020617;
      --bg-secondary: #0f172a;
      --bg-tertiary: #1e293b;
      --border: #1e293b;
      --border-light: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-bg: #111827;
      --user-border: #1f2937;
      --success: #10b981;
      --error: #ef4444;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-secondary);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #34d399, #3b82f6);
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }

    .sidebar-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .new-chat-btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .new-chat-btn:hover {
      background: var(--border-light);
      border-color: #475569;
    }

    .sidebar-section {
      margin-top: 1.5rem;
    }

    .sidebar-label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .sidebar-select, .sidebar-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 0.5rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .sidebar-select:focus, .sidebar-input:focus {
      border-color: var(--accent);
    }

    .token-warning {
      font-size: 0.75rem;
      color: var(--success);
      margin-top: 0.5rem;
      line-height: 1.4;
    }

    .clear-btn {
      margin-top: 0.5rem;
      background: none;
      border: none;
      color: var(--error);
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.6);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      min-width: 0;
    }

    .main-header {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      font-size: 1.25rem;
    }

    .header-model {
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1.5rem;
      scroll-behavior: smooth;
    }

    .messages-list {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .empty-state h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 85%;
      display: flex;
      gap: 0.75rem;
    }

    .message-row.user .message-content {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .message-row.assistant .message-avatar {
      background: var(--accent);
      color: #fff;
    }

    .message-row.user .message-avatar {
      background: var(--success);
      color: var(--bg-primary);
    }

    .message-bubble {
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      line-height: 1.65;
      word-wrap: break-word;
    }

    .message-row.user .message-bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--text-primary);
      border-bottom-right-radius: 0.25rem;
    }

    .message-row.assistant .message-bubble {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-bottom-left-radius: 0.25rem;
    }

    .typing-bubble {
      display: flex;
      align-items: center;
      padding: 1.25rem !important;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      display: inline-block;
      margin-right: 3px;
    }

    .input-area {
      border-top: 1px solid var(--border);
      padding: 1.25rem 1.5rem 1.5rem;
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
    }

    .chat-textarea {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      color: var(--text-primary);
      padding: 0.875rem 3rem 0.875rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 52px;
      max-height: 200px;
      overflow-y: auto;
    }

    .send-btn {
      position: absolute;
      right: 0.6rem;
      bottom: 0.6rem;
      width: 32px;
      height: 32px;
      border-radius: 0.5rem;
      background: var(--accent);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .error-row .message-bubble {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">H</div>
        <div class="sidebar-title">HF Chat</div>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        + Нов чат
      </button>

      <a href="index.html" class="new-chat-btn" style="text-decoration: none; margin-top: 0.5rem; background: #1e293b;">
        📱 Към Основния Чат
      </a>

      <div class="sidebar-section">
        <label class="sidebar-label" for="modelSelect">Модел</label>
        <select class="sidebar-select" id="modelSelect">
          <option value="Qwen/Qwen2.5-72B-Instruct">Qwen 2.5 72B Instruct</option>
          <option value="deepseek-ai/DeepSeek-R1-Distill-Qwen-32B">DeepSeek R1 Distill Qwen 32B</option>
          <option value="meta-llama/Meta-Llama-3-8B-Instruct">Meta Llama 3 8B Instruct</option>
          <option value="mistralai/Mistral-7B-Instruct-v0.2">Mistral 7B Instruct v0.2</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="tokenInput">API Токен</label>
        <input type="password" class="sidebar-input" id="tokenInput" placeholder="hf_...">
        <div class="token-warning" id="tokenStatus">Токенът се запазва локално.</div>
        <button class="clear-btn" id="clearTokenBtn">Изтрий запазения токен</button>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="main-header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" aria-label="Open sidebar">
            ☰
          </button>
          <div class="header-model">
            <span class="status-dot"></span>
            <span id="modelDisplay">Qwen 2.5 72B Instruct</span>
          </div>
        </div>
      </header>

      <div class="chat-window" id="chatWindow">
        <div class="messages-list" id="messagesList">
          <div class="empty-state" id="emptyState">
            <h2>Започни разговор</h2>
            <p>Въведи токен в менюто веднъж — той ще се запази автоматично.</p>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea class="chat-textarea" id="chatInput" placeholder="Напиши съобщение..." rows="1"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send">➔</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var messages = [
        { role: 'system', content: 'You are a helpful assistant.' }
      ];
      var isGenerating = false;

      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('overlay');
      var menuToggle = document.getElementById('menuToggle');
      var newChatBtn = document.getElementById('newChatBtn');
      var modelSelect = document.getElementById('modelSelect');
      var tokenInput = document.getElementById('tokenInput');
      var tokenStatus = document.getElementById('tokenStatus');
      var clearTokenBtn = document.getElementById('clearTokenBtn');
      var modelDisplay = document.getElementById('modelDisplay');
      var chatWindow = document.getElementById('chatWindow');
      var messagesList = document.getElementById('messagesList');
      var emptyState = document.getElementById('emptyState');
      var chatInput = document.getElementById('chatInput');
      var sendBtn = document.getElementById('sendBtn');

      // 1. Зареждане на токена
      var savedToken = localStorage.getItem('hf_api_token');
      if (savedToken) {
        tokenInput.value = savedToken;
        tokenStatus.textContent = "✓ Токенът е зареден.";
      }

      // 2. Запазване на токена
      tokenInput.addEventListener('input', function () {
        var val = tokenInput.value.trim();
        if (val) {
          localStorage.setItem('hf_api_token', val);
          tokenStatus.textContent = "✓ Токенът е запазен.";
        } else {
          localStorage.removeItem('hf_api_token');
          tokenStatus.textContent = "Няма запазен токен.";
        }
      });

      // 3. Изтриване
      clearTokenBtn.addEventListener('click', function () {
        localStorage.removeItem('hf_api_token');
        tokenInput.value = '';
        tokenStatus.textContent = "Токенът бе изтрит.";
      });

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function scrollToBottom() {
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      function createMessageElement(role, text, isError) {
        var row = document.createElement('div');
        row.className = 'message-row ' + (isError ? 'error-row' : role);

        var contentWrap = document.createElement('div');
        contentWrap.className = 'message-content';

        var avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = role === 'user' ? 'Аз' : 'AI';

        var bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');

        contentWrap.appendChild(avatar);
        contentWrap.appendChild(bubble);
        row.appendChild(contentWrap);
        return row;
      }

      function showTyping() {
        var row = document.createElement('div');
        row.className = 'message-row assistant typing-row';
        row.id = 'typingRow';

        var contentWrap = document.createElement('div');
        contentWrap.className = 'message-content';

        var avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = 'AI';

        var bubble = document.createElement('div');
        bubble.className = 'message-bubble typing-bubble';
        bubble.innerHTML = '<div class="typing-indicator"><span>.</span><span>.</span><span>.</span></div>';

        contentWrap.appendChild(avatar);
        contentWrap.appendChild(bubble);
        row.appendChild(contentWrap);
        messagesList.appendChild(row);
        scrollToBottom();
      }

      function removeTyping() {
        var row = document.getElementById('typingRow');
        if (row) row.remove();
      }

      function renderMessages() {
        messagesList.innerHTML = '';
        var visible = messages.filter(function(m) { return m.role !== 'system'; });

        if (visible.length === 0) {
          messagesList.appendChild(emptyState);
          return;
        }

        visible.forEach(function(msg) {
          messagesList.appendChild(createMessageElement(msg.role, msg.content, false));
        });

        scrollToBottom();
      }

      function addErrorMessage(text) {
        removeTyping();
        var el = createMessageElement('assistant', text, true);
        messagesList.appendChild(el);
        scrollToBottom();
      }

      function sendMessage() {
        if (isGenerating) return;

        var text = chatInput.value.trim();
        if (!text) return;

        var token = tokenInput.value.trim() || localStorage.getItem('hf_api_token');

        if (!token) {
          alert('Моля, въведи своя Hugging Face токен в страничното меню!');
          sidebar.classList.add('open');
          overlay.classList.add('active');
          return;
        }

        messages.push({ role: 'user', content: text });
        chatInput.value = '';
        chatInput.style.height = 'auto';
        isGenerating = true;

        renderMessages();
        showTyping();

        var model = modelSelect.value;

        fetch('https://router.huggingface.co/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model,
            messages: messages,
            max_tokens: 1024,
            temperature: 0.7
          })
        })
        .then(function(response) {
          removeTyping();
          if (!response.ok) {
            return response.json().then(function(errData) {
              var msg = 'Грешка ' + response.status;
              if (errData.error && errData.error.message) msg += ': ' + errData.error.message;
              addErrorMessage(msg);
              isGenerating = false;
            }).catch(function() {
              addErrorMessage('Грешка ' + response.status + ': ' + response.statusText);
              isGenerating = false;
            });
          }
          return response.json().then(function(data) {
            var generated = '';
            if (data.choices && data.choices[0] && data.choices[0].message) {
              generated = data.choices[0].message.content;
            } else {
              generated = JSON.stringify(data);
            }
            messages.push({ role: 'assistant', content: generated });
            renderMessages();
            isGenerating = false;
          });
        })
        .catch(function(err) {
          removeTyping();
          addErrorMessage('Грешка: ' + err.message);
          isGenerating = false;
        });
      }

      sendBtn.addEventListener('click', sendMessage);

      chatInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      chatInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 200) + 'px';
      });

      newChatBtn.addEventListener('click', function () {
        messages = [
          { role: 'system', content: 'You are a helpful assistant.' }
        ];
        renderMessages();
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
        }
      });

      modelSelect.addEventListener('change', function () {
        modelDisplay.textContent = modelSelect.options[modelSelect.selectedIndex].text;
      });

      menuToggle.addEventListener('click', function () {
        sidebar.classList.add('open');
        overlay.classList.add('active');
      });

      overlay.addEventListener('click', function () {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      });

      renderMessages();
    });
  </script>
</body>
</html>
